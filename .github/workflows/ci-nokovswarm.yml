name: NokovSwarm

on:
  push:
    branches:
      - week5

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Update Submodules
      uses: actions/checkout@v3
      with:
        path: nokov_swarm
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ros-galactic-desktop

    - name: Build workspace
      run: |
        source /opt/ros/galactic/setup.bash
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        cd nokov_swarm/nokov_swarm
        conda create -f environment.yaml
        echo "source /home/nokov/miniconda3/envs/nokovswarm/bin/activate" >> ~/.bashrc
        source ~/.bashrc

    - name: Run tests
      run: |
        cd nokov_swarm/test
        ./run_all_test.sh

    - name: Package
      run: |
        cd nokov_swarm/nokov_swarm/build_scripts
        ./build_linux.sh
        cd ../dist
        ./NokovSwarm
      