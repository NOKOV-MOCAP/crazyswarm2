name: NokovSwarm

on:
  push:
    branches:
      - week5

jobs:
  build_docker: # On Linux, use docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distribution:
          - galactic
         # Define the Docker image(s) associated with each ROS distribution.
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ubuntu:20.04
            ros_distribution: galactic 
            ros_version: 2

    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: setup ROS environment
        uses: ros-tooling/setup-ros@v0.5
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }} 
          
      - name: Update Submodules
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}
          path: nokov_swarm
          submodules: true
          
      - name: install dependencies
        run: |
           apt update
           apt install -y libboost-program-options-dev libusb-1.0-0-dev
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libegl1 libxcb-xinerama0
      
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: '3.8'
          activate-environment: nokovswarm
          environment-file: nokov_swarm/nokov_swarm/nokov_swarm/environment.yaml
          auto-activate-base: false
          
      - name: Run tests
        run: |
          conda init bash
          source ~/.bashrc
          conda activate nokovswarm
          cd nokov_swarm/nokov_swarm/test
          ./run_all_test.sh
  
      - name: Package
        run: |
          conda init bash
          source ~/.bashrc
          conda activate nokovswarm          
          cd nokov_swarm/nokov_swarm/nokov_swarm/build_scripts
          ./build_linux.sh